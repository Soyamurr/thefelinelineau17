<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Feline Line</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="gameWrap" class="wrap">
  <section id="menuScreen" class="screen menu-screen">
    <div class="menu-overlay"></div>
    <div class="menu-content">
      <h1>The Feline Line</h1>
      <p>tower defense + merging cat game</p>
      <div class="menu-buttons">
        <button id="playBtn">Play</button>
        <button id="quitBtn">Quit</button>
      </div>
      <div class="settings">
        <b>Sound Settings</b>
        <label>Music <input id="musicVolume" type="range" min="0" max="1" step=".01" value=".45"></label>
        <label>SFX <input id="sfxVolume" type="range" min="0" max="1" step=".01" value=".8"></label>
        <button id="soundToggle">Sound: ON</button>
      </div>
      <div id="quitMsg"></div>
    </div>
  </section>

  <section id="gameScreen" class="screen game-screen hidden">
    <div class="hud">
      <div class="pill"><span id="pointsLabel">10</span> pts</div>
      <div class="pill">Lives: <span id="livesLabel">3</span></div>
      <div class="pill">Wave: <span id="waveLabel">0</span> / <span id="waveTotalLabel">6</span></div>
      <div class="pill" id="stateLabel">Playing</div>
      <button class="pill" id="menuBtn">⟵ Menu</button>
    </div>
    <div class="board">
      <div class="shop" id="shop"></div>
      <div class="field-col">
        <div class="wave-bar"><div id="waveBarFill"></div><div id="waveBarMarker"></div></div>
        <canvas id="field" width="680" height="480"></canvas>
        <div id="log"></div>
        <button id="restartBtn">Restart</button>
      </div>
    </div>
  </section>
</div>
<script src="script.js"></script>
</body>
</html>
